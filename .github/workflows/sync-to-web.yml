name: sync core to targets

# core/ değiştiğinde hedef repolara PR açar.
# İKİ HEDEFLİ (M5'te eklendi): hasat-d2c-marketplace (web) + hasat-mobile.

on:
  push:
    branches: [main]
    paths: ["core/**"]
  workflow_dispatch:

env:
  PREFIX: src/lib/core

jobs:
  prepare:
    runs-on: ubuntu-latest
    # core-dist dalini bu repoya geri itiyoruz — varsayilan GITHUB_TOKEN
    # salt-okunur oldugu icin acikca yazma izni gerekiyor.
    permissions:
      contents: write
    steps:
      - name: hasat-core'u çek
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Manifest güncel mi
        run: |
          node scripts/gen-manifest.mjs
          git diff --exit-code core/.manifest \
            || { echo "::error::core/.manifest güncel değil — 'npm run manifest' çalıştırıp commit et."; exit 1; }

      - name: core-dist dalını üret ve it
        run: |
          git subtree split --prefix=core --branch core-dist
          git push --force origin core-dist

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_repo: berkinsavciozen/hasat-d2c-marketplace
            sync_branch_prefix: core-sync-web
          - target_repo: berkinsavciozen/hasat-mobile
            sync_branch_prefix: core-sync-mobile
    steps:
      - name: Hedef repoyu çek
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target_repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Subtree pull + PR
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_BRANCH: ${{ matrix.sync_branch_prefix }}/${{ github.sha }}
        run: |
          git config user.name  "hasat-core sync"
          git config user.email "noreply@github.com"
          git checkout -b "$SYNC_BRANCH"
          git subtree pull --prefix="$PREFIX" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            core-dist --squash -m "hasat-core sync: ${{ github.sha }}"
          if git diff --quiet origin/main -- "$PREFIX"; then
            echo "Değişiklik yok — PR açılmıyor."
            exit 0
          fi
          git push -u origin "$SYNC_BRANCH"
          BODY=$(printf '%s\n' \
            "hasat-core \`${{ github.sha }}\` commit'inden otomatik sync." \
            "" \
            "Bu PR yalnızca \`$PREFIX\` altını değiştirir. Kural #105: bu dosyalar burada düzenlenmez." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          gh pr create --repo "${{ matrix.target_repo }}" --base main --head "$SYNC_BRANCH" \
            --title "hasat-core sync → $PREFIX" \
            --body "$BODY"
