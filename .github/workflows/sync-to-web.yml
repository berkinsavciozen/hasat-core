name: sync core to web

# core/ değiştiğinde hasat-d2c-marketplace reposuna PR açar.
# Şimdilik TEK HEDEFLİ — hasat-mobile hedefi M5'te eklenecek.

on:
  push:
    branches: [main]
    paths: ["core/**"]
  workflow_dispatch:

env:
  TARGET_REPO: berkinsavciozen/hasat-d2c-marketplace
  PREFIX: src/lib/core
  SYNC_BRANCH: core-sync/${{ github.sha }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: hasat-core'u çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest güncel mi
        run: |
          node scripts/gen-manifest.mjs
          git diff --exit-code core/.manifest \
            || { echo "::error::core/.manifest güncel değil — 'npm run manifest' çalıştırıp commit et."; exit 1; }

      - name: core-dist dalını üret ve it
        run: |
          git subtree split --prefix=core --branch core-dist
          git push --force origin core-dist

      - name: Web reposunu çek
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Subtree pull + PR
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name  "hasat-core sync"
          git config user.email "noreply@github.com"
          git checkout -b "$SYNC_BRANCH"
          git subtree pull --prefix="$PREFIX" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            core-dist --squash -m "hasat-core sync: ${{ github.sha }}"
          if git diff --quiet origin/main -- "$PREFIX"; then
            echo "Değişiklik yok — PR açılmıyor."
            exit 0
          fi
          git push -u origin "$SYNC_BRANCH"
          BODY=$(printf '%s\n' \
            "hasat-core \`${{ github.sha }}\` commit'inden otomatik sync." \
            "" \
            "Bu PR yalnızca \`$PREFIX\` altını değiştirir. Kural #105: bu dosyalar burada düzenlenmez." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          gh pr create --repo "$TARGET_REPO" --base main --head "$SYNC_BRANCH" \
            --title "hasat-core sync → $PREFIX" \
            --body "$BODY"
