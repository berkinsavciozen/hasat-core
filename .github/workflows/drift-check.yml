name: drift check (targets)

# Hedef repolara inmiş core kopyalarının hâlâ manifest ile birebir aynı
# olduğunu doğrular. Yakalamak istediği senaryo: Lovable'ın (veya bir
# başkasının) src/lib/core/ altındaki bir dosyaya yazması — P24'te bir kez
# oldu.
#
# İKİ HEDEFLİ (M5'te eklendi): hasat-d2c-marketplace (web) + hasat-mobile.
#
# Ayrıca sürüm-gerisi kontrolü (M5'te eklendi — bkz.
# hasat-vault/Build/Shared-Architecture.md → "Drift kontrolünün kör noktası"):
# hedefin manifest'i kendi içinde tutarlı olsa bile hasat-core'un GÜNCEL
# core/.manifest'inden geride kalmış olabilir (bekleyen bir sync PR'ı merge
# edilmediyse). check-drift.mjs bunu yakalamaz, çünkü sadece hedefin kendi
# manifest'ine karşı doğrular — bu yüzden ayrı bir adım gerekiyor.
#
# .env İÇERİK BEKÇİSİ (M5-a-ek'te eklendi, yalnızca hasat-mobile hedefinde):
# hasat-mobile/.env public repoda takip ediliyor (bilinçli — silinirse/
# gitignore'lanırsa her klonda uygulama açılamaz). İçindeki iki değer
# (Supabase URL + anon publishable key) tasarım gereği public. Bekçi dosyanın
# VARLIĞINI değil İÇERİĞİNİ denetler — BEYAZ LİSTE (M5-b'de kara listeden
# çevrildi, bkz. scripts/check-env-guard.mjs): yalnızca bilinen iki değişken
# adına izin var, listede olmayan HER isim (kalıp taşısın taşımasın) reddedilir.
#
# BU KONTROL AYRICA hasat-mobile'ın KENDİ reposunda `push` üzerinde çalışan
# ayrı bir workflow olarak da var (`hasat-mobile/.github/workflows/env-guard.yml`,
# bu script'i salt-okunur checkout ile çağırıyor) — buradaki günlük+push
# kontrolü SADECE hasat-core'a dokunulduğunda tetikleniyor, hasat-mobile'a
# doğrudan push (örn. .env elle düzenlenirse) bunu hiç görmüyordu, sır sızması
# 24 saate kadar (bir sonraki 06:00 cron'a kadar) fark edilmiyordu. Buradaki
# günlük kontrol artık YEDEK katman; birincil savunma hasat-mobile'daki push
# workflow'u.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["core/**", "scripts/**"]

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_repo: berkinsavciozen/hasat-d2c-marketplace
          - target_repo: berkinsavciozen/hasat-mobile
    steps:
      - uses: actions/checkout@v5

      - name: Hedef repoyu çek
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.target_repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
          ref: main

      - name: Sapma kontrolü (elle düzenleme var mı)
        run: node scripts/check-drift.mjs target/src/lib/core

      - name: Sürüm-gerisi kontrolü (bekleyen sync PR'ı var mı)
        run: node scripts/check-manifest-freshness.mjs target/src/lib/core

      - name: Yasaklı import taraması (kural #105/#106 — Supabase types.ts)
        run: node scripts/check-forbidden-imports.mjs target

      - name: .env içerik bekçisi (yalnızca hasat-mobile)
        if: matrix.target_repo == 'berkinsavciozen/hasat-mobile'
        run: node scripts/check-env-guard.mjs target
